# Sites allowed to use the comments service.
#
# `domains` is the list of host names allowed to embed the service for that site
# (production and staging). Pages on any other domain get nothing: the API, the
# sign-in popup and the widget refuse them. A domain belongs to one site only.
# To add a domain: add it here and redeploy the service.
#
# `dev_origins` are accepted only when the service runs with ALLOW_DEV_ORIGINS=true
# (never in production).
#
# `bake_after_days`: published comments older than this are written into the
# site's static HTML by its build (export endpoint).
#
# `rebuild.coolify_app`: the site's production app on Coolify, rebuilt at night when
# its baked comments changed (needs COOLIFY_API_URL and COOLIFY_DEPLOY_TOKEN).
#
# `reactions`: one-click reactions shown under each page (at most 8).
# The labels below are placeholders to review.

sites:
  alt-web:
    name: Alt Web
    domains: [www.alt-web.org, alt-web.org, alt-web-staging.babelcoach.com]
    dev_origins: [http://localhost:4325, http://localhost:4399, http://localhost:4396]
    languages: [en, fr, de]
    bake_after_days: 7
    rebuild: { coolify_app: wig1jycbj6pmcmzlvhmoi5mv }   # production app on Coolify
    reactions:
      - { id: useful, icon: "👍", label: { en: Useful, fr: Utile, de: Hilfreich } }
      - { id: tried, icon: "✅", label: { en: I use it, fr: Je l’utilise, de: Nutze ich } }
      - { id: disagree, icon: "🤔", label: { en: I disagree, fr: Pas d’accord, de: Sehe ich anders } }

